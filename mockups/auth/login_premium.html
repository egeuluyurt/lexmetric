<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexMetric | Secure Client Portal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-ivory: #FDFCFB;
            --slate-900: #1E293B;
            --accent-gold: #C5A059;
            --legal-blue: #1a365d;
            --border-light: rgba(26, 54, 93, 0.08);
            --text-muted: #64748B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-ivory);
            color: var(--slate-900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Elegant Paper Texture */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
        }

        /* Ambient Background Glow */
        body::after {
            content: "";
            position: fixed;
            top: -20%;
            right: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.08) 0%, rgba(253, 252, 251, 0) 70%);
            z-index: -2;
            pointer-events: none;
        }

        /* Navigation Minimal */
        .navbar {
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--legal-blue);
            letter-spacing: -1px;
            text-decoration: none;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--legal-blue);
        }

        /* Main Content */
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .login-card {
            background: white;
            padding: 50px 48px;
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border-light);
            box-shadow: 0 20px 60px rgba(26, 54, 93, 0.05);
            border-radius: 4px;
            position: relative;
            animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {

            0%,
            100% {
                box-shadow: 0 15px 40px rgba(26, 54, 93, 0.12);
            }

            50% {
                box-shadow: 0 20px 50px rgba(197, 160, 89, 0.25);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-icon {
            font-size: 32px;
            margin-bottom: 16px;
            display: block;
        }

        .login-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--legal-blue);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }

        /* Social Auth */
        .social-auth {
            margin-bottom: 24px;
        }

        .btn-google {
            width: 100%;
            padding: 12px;
            background: white;
            color: var(--slate-900);
            border: 1px solid var(--border-light);
            border-radius: 2px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .btn-google:hover {
            border-color: var(--accent-gold);
            background: var(--bg-ivory);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-light);
        }

        .divider::before {
            margin-right: 12px;
        }

        .divider::after {
            margin-left: 12px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--legal-blue);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-ivory);
            border: 1px solid var(--border-light);
            border-radius: 2px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--slate-900);
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.1);
            background: white;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--legal-blue);
            color: white;
            border: none;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: var(--accent-gold);
            transform: translateY(-2px);
            animation: glow 2s ease-in-out infinite;
        }

        .form-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 12px;
        }

        .text-link {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }

        .text-link:hover {
            color: var(--legal-blue);
        }

        .signup-cta {
            margin-top: 32px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-light);
            padding-top: 24px;
        }

        .signup-cta a {
            color: var(--legal-blue);
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
        }

        .signup-cta a:hover {
            color: var(--accent-gold);
        }

        .footer {
            text-align: center;
            padding: 32px;
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .navbar {
                padding: 20px;
            }

            .login-card {
                padding: 32px 20px;
                box-shadow: none;
                border: none;
                background: transparent;
            }

            .form-input {
                background: white;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="landing.html" class="logo">LEXMETRIC</a>
        <a href="landing.html" class="back-link">
            ← Return to Home
        </a>
    </nav>

    <div class="main-container">
        <div class="login-card">
            <div class="login-header">
                <span class="login-icon">🔒</span>
                <h1>Client Access</h1>
                <p>Secure login for authorized personnel only.</p>
            </div>

            <!-- Social Auth -->
            <div class="social-auth">
                <button class="btn-google">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg>
                    Sign in with Google
                </button>
            </div>

            <div class="divider">Or continue with email</div>

            <form>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" placeholder="name@firm.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" placeholder="••••••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Secure Sign In</button>

                <div class="form-links">
                    <a href="#" class="text-link">Forgot Password?</a>
                </div>

                <div class="signup-cta">
                    Don't have an account? <a href="#">Request Access</a>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 LexMetric. HIPAA Compliant & SOC 2 Type II Encrypted.</p>
    </footer>

</body>

</html>
